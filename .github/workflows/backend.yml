name: Backend CI and artifacts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and verify Docker startup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate formatting, test, and package
        run: bash ./gradlew --no-daemon spotlessCheck test bootJar
      - name: Build deployment image
        run: docker build --tag retailflow-ci .
      - name: Verify H2 application startup
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name retailflow-ci --publish 127.0.0.1:18080:8080 \
            --env SPRING_PROFILES_ACTIVE=prod retailflow-ci
          trap 'docker logs retailflow-ci; docker rm -f retailflow-ci >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 3 http://127.0.0.1:18080/api/health > /tmp/health.json; then
              python3 -c 'import json; d=json.load(open("/tmp/health.json")); assert d["status"] == "UP" and d["database"] == "H2"'
              exit 0
            fi
            sleep 2
          done
          echo 'Backend failed to become healthy.' >&2
          exit 1
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: build/reports/tests/test/
          if-no-files-found: ignore

      - name: Upload verified backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: retailflow-backend-${{ github.sha }}
          path: build/libs/app.jar
          if-no-files-found: error
          retention-days: 14
