server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/retailflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/h2
retailflow:
  storage:
    # Optional Cloudflare R2 image storage. Leave R2_BUCKET empty to disable (the app then keeps images on-device).
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      public-url: ${R2_PUBLIC_URL:}

  auth:
    username: ${RETAILFLOW_USERNAME:morkraksa}
    password: ${RETAILFLOW_PASSWORD:admin1234}
