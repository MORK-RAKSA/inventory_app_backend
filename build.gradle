plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id "com.diffplug.spotless" version "6.25.0"
}
group = 'com.retailflow'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    // Cloudflare R2 is S3-compatible. Pinned below 2.30: newer SDKs send default CRC checksums that R2 rejects.
    implementation 'software.amazon.awssdk:s3:2.28.29'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
tasks.named('test') { useJUnitPlatform() }


spotless {
    java {
        // Use Google Java Format with standard configuration
        googleJavaFormat('1.17.0')

        // Optional customizations
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()

        // Define which files to include/exclude
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
    }
}