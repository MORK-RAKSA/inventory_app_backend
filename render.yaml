services:
  - type: web
    name: retailflow-spring-api
    runtime: docker
    autoDeployTrigger: "off"
    plan: starter
    disk:
      name: retailflow-data
      mountPath: /var/data
      sizeGB: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: H2_DATABASE_PATH
        value: /var/data/retailflow
      - key: H2_PASSWORD
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SWAGGER_ENABLED
        value: "false"
