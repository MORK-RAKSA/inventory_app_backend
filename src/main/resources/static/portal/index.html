<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetailFlow · Management Portal</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#f6f4fb;color:#281c45}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}aside{background:#291d48;color:white;padding:28px 18px}.brand{font-weight:900;font-size:23px;margin:0 0 40px 14px}.nav{width:100%;text-align:left;border:0;background:transparent;color:#c9bee2;padding:14px 16px;border-radius:13px;margin:3px 0}.nav.active,.nav:hover{background:#7152b1;color:white}main{padding:34px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;margin-bottom:25px}h1{margin:0;font-size:30px}h2{font-size:19px;margin:0 0 15px}.sub{color:#827594;font-size:13px;margin-top:8px}.panel,.stat{background:white;border-radius:20px;padding:22px;box-shadow:0 5px 25px #5033790a;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat label{color:#8b7e9f;font-size:13px}.stat strong{display:block;font-size:26px;margin-top:12px}.hero{background:linear-gradient(125deg,#8060d6,#452889);color:white}.hero label{color:#e2d7ff}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.btn{border:0;background:#7251bd;color:white;border-radius:12px;padding:11px 17px;font-weight:750}.btn.secondary{background:#efe9f9;color:#56388b}.btn.danger{background:#ffeced;color:#b52549}.btn:disabled{opacity:.5;cursor:not-allowed}input,select{border:1px solid #ded6eb;border-radius:11px;padding:11px 13px;background:white;color:#281c45;min-width:0}input:focus,select:focus{outline:2px solid #bba4ed}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:170px}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#837598}td,th{padding:13px 10px;border-bottom:1px solid #f0ecf7}td{font-size:14px}td .btn{padding:7px 10px;font-size:12px}.scroll{overflow:auto}.tag{border-radius:20px;background:#f5eddf;color:#9a660d;padding:4px 9px;font-size:12px}.view{display:none}.view.active{display:block}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.cart-item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee7f5;padding:12px 0}.total{font-size:28px;font-weight:900}.row{display:flex;gap:12px;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-grid label{font-size:12px;color:#716286;display:grid;gap:7px}.form-grid label.wide{grid-column:1/-1}dialog{border:0;border-radius:20px;max-width:550px;width:calc(100% - 28px);padding:25px;box-shadow:0 30px 100px #20133655}dialog::backdrop{background:#23183d99}#toast{position:fixed;right:22px;bottom:22px;background:#372350;color:white;padding:15px 21px;border-radius:15px;max-width:340px;box-shadow:0 12px 30px #37235044;display:none;z-index:9}#toast.error{background:#a62f50}.skeleton{height:17px;border-radius:9px;margin:12px 0;background:linear-gradient(90deg,#f0edf7,#ded6ed,#f0edf7);background-size:200% 100%;animation:shimmer 1.2s infinite}@keyframes shimmer{to{background-position-x:-200%}}#camera{width:100%;max-height:330px;background:black;border-radius:14px}#scanStatus{font-size:13px;color:#827594}.bars{height:120px;display:flex;align-items:end;gap:7px}.bar{background:#b5a0e5;min-width:10px;flex:1;border-radius:7px 7px 0 0}small{color:#837598}@media(max-width:950px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:650px){.shell{display:block}aside{display:flex;align-items:center;overflow:auto;padding:8px}.brand{margin:0 14px;font-size:18px}.nav{width:auto;white-space:nowrap;margin:0;padding:10px}main{padding:20px 12px}.stats{gap:8px}.stat{padding:15px}.stat strong{font-size:20px}h1{font-size:24px}.form-grid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside><div class="brand">◈ RetailFlow</div><button class="nav active" data-tab="overview">▦ Overview</button><button class="nav" data-tab="inventory">▤ Inventory</button><button class="nav" data-tab="checkout">▣ Checkout</button><button class="nav" data-tab="sales">◷ Sales</button></aside><main><div class="top"><div><h1 id="heading">Overview</h1><div class="sub">Retail intelligence and daily operations · Live backend data</div></div><div class="actions"><span id="sync" class="sub"></span><button class="btn secondary" id="reload">↻ Refresh</button></div></div>
<section id="overview" class="view active"><div id="stats" class="stats"></div><div class="grid2"><div class="panel"><h2>Sales · last 7 days</h2><div id="chart" class="bars"></div></div><div class="panel"><h2>Low-stock attention</h2><div id="low"></div></div></div><div class="panel"><h2>Quick actions</h2><div class="actions"><button class="btn" data-go="inventory">Add a product</button><button class="btn secondary" data-go="checkout">Open checkout</button><button class="btn secondary" data-go="sales">Review sales</button></div></div></section>
<section id="inventory" class="view"><div class="panel"><div class="toolbar"><input id="filter" placeholder="Search name, barcode or category…"><button class="btn secondary" id="inventoryScan">▣ Scan</button><button class="btn" id="newProduct">+ Add product</button></div><div class="scroll" id="productsTable"></div></div></section>
<section id="checkout" class="view"><div class="grid2"><div class="panel"><h2>Find products</h2><div class="toolbar"><input id="checkoutSearch" placeholder="Scan barcode or search…" autocomplete="off"><button class="btn secondary" id="checkoutScan">▣ Camera</button></div><div class="scroll" id="checkoutProducts"></div></div><div class="panel"><h2>Current cart <span id="cartUnits" class="sub"></span></h2><div id="cart"></div><div style="margin:20px 0"><small>Subtotal USD</small><div class="total" id="total">$0.00</div><small id="totalKhr"></small></div><div class="toolbar"><select id="currency"><option>USD</option><option>KHR</option></select><button class="btn" id="pay">Complete checkout</button><button class="btn secondary" id="clearCart">Clear</button></div></div></div></section>
<section id="sales" class="view"><div class="panel"><h2>Recent transactions</h2><div id="salesTable" class="scroll"></div></div></section>
</main></div><dialog id="editor"><h2 id="editorTitle">Product</h2><form id="productForm" class="form-grid"><label class="wide">Product name<input name="name" required maxlength="180"></label><label>Barcode<input name="barcode" placeholder="EAN / UPC / Code128"></label><label>Category<input name="category" required value="General"></label><label>Price (USD)<input name="price" type="number" min="0" step="0.01" required></label><label>Stock<input name="stock" type="number" min="0" step="1" required></label><label>Low stock threshold<input name="lowStockThreshold" type="number" min="0" step="1" required value="5"></label><div class="wide actions" style="justify-content:flex-end;margin-top:12px"><button class="btn secondary" type="button" id="cancelEditor">Cancel</button><button class="btn" type="submit">Save product</button></div></form></dialog><dialog id="scanner"><h2>Scan a barcode</h2><video id="camera" autoplay muted playsinline></video><p id="scanStatus">Initializing camera…</p><div class="toolbar"><input id="manualCode" placeholder="Or enter barcode" autocomplete="off"><button class="btn" id="submitCode">Use code</button><button class="btn secondary" id="closeScanner">Close</button></div></dialog><div id="toast" role="status" aria-live="polite"></div><script>
'use strict';const $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toFixed(2),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[],sales=[],rate=4100,cart={},editing=null,activeTab='overview',scanMode='checkout',stream=null,scanRunning=false,lastBarcode='',lastBarcodeTime=0,loading=false;const base='/api';let portalAuth=null;
function toast(msg,error=false){const el=$('toast');el.textContent=msg;el.className=error?'error':'';el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',4000)}
async function req(path,opts={}){let res=await fetch(base+path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(portalAuth?.accessToken||''),...(opts.headers||{})}});if(res.status===401&&portalAuth){const rr=await fetch(base+'/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:portalAuth.refreshToken})});if(rr.ok){portalAuth=await rr.json();res=await fetch(base+path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+portalAuth.accessToken,...(opts.headers||{})}})}else{portalAuth=null;document.getElementById('portalLogin').style.display='flex'}}const str=await res.text();let data;try{data=str?JSON.parse(str):null}catch{data=null}if(!res.ok)throw Error(data?.error||data?.message||`Server error ${res.status}`);return data}
function skeleton(){return '<div class="skeleton"></div><div class="skeleton" style="width:75%"></div><div class="skeleton" style="width:55%"></div>'}
async function refresh(){if(loading)return;loading=true;$('reload').disabled=true; if(!products.length)$('productsTable').innerHTML=skeleton();try{const [p,s,settings]=await Promise.all([req('/products'),req('/sales'),req('/settings')]);products=p;sales=s;rate=Number(settings.usdToKhr)||4100;$('sync').textContent='Updated '+new Date().toLocaleTimeString();render()}catch(e){toast(e.message,true);if(!products.length)$('productsTable').innerHTML='<p>Could not load inventory. Check server connection.</p>'}finally{loading=false;$('reload').disabled=false}}
function navigate(tab){activeTab=tab;document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===tab));document.querySelectorAll('.nav').forEach(e=>e.classList.toggle('active',e.dataset.tab===tab));$('heading').textContent=tab[0].toUpperCase()+tab.slice(1);render()}
function render(){const today=new Date().toDateString(),daySales=sales.filter(s=>new Date(s.createdAt).toDateString()===today),todayTotal=daySales.reduce((a,s)=>a+Number(s.totalUsd),0),low=products.filter(p=>p.stock<=p.lowStockThreshold),inventoryValue=products.reduce((a,p)=>a+p.stock*Number(p.priceUsd),0);$('stats').innerHTML=[['Today’s sales',money(todayTotal)],['Transactions',daySales.length],['Inventory value',money(inventoryValue)],['Low-stock alerts',low.length]].map(([t,v],i)=>`<div class="stat ${i===0?'hero':''}"><label>${t}</label><strong>${v}</strong></div>`).join('');$('low').innerHTML=low.length?low.slice(0,8).map(p=>`<div class="cart-item"><span>${escapeHTML(p.name)}</span><span class="tag">${p.stock} left</span></div>`).join(''):'<p class="sub">All products are well stocked.</p>';let vals=Array.from({length:7},(_,i)=>{let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return sales.filter(s=>new Date(s.createdAt).toDateString()===d.toDateString()).reduce((a,s)=>a+Number(s.totalUsd),0)}),max=Math.max(1,...vals);$('chart').innerHTML=vals.map((v,i)=>`<div class="bar" style="height:${Math.max(5,v/max*100)}%" title="${i+1} · ${money(v)}"></div>`).join('');renderInventory();renderCheckout();$('salesTable').innerHTML=`<table><thead><tr><th>Date</th><th>Receipt</th><th>Items</th><th>Total USD</th><th>Total KHR</th></tr></thead><tbody>${sales.slice(0,100).map(s=>`<tr><td>${escapeHTML(new Date(s.createdAt).toLocaleString())}</td><td>${escapeHTML(s.id.slice(0,8))}</td><td>${(s.items||[]).reduce((n,x)=>n+x.quantity,0)}</td><td>${money(s.totalUsd)}</td><td>៛${Number(s.totalKhr).toLocaleString()}</td></tr>`).join('')}</tbody></table>`}
function renderInventory(){const q=$('filter').value.toLowerCase();const filtered=products.filter(p=>[p.name,p.barcode,p.category].join(' ').toLowerCase().includes(q));$('productsTable').innerHTML=`<table><thead><tr><th>Product</th><th>Barcode</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody>${filtered.map(p=>`<tr><td><b>${escapeHTML(p.name)}</b></td><td>${escapeHTML(p.barcode||'—')}</td><td>${escapeHTML(p.category)}</td><td>${money(p.priceUsd)}</td><td>${p.stock<=p.lowStockThreshold?`<span class="tag">${p.stock}</span>`:p.stock}</td><td><button class="btn secondary" data-edit="${p.id}">Edit</button> <button class="btn danger" data-delete="${p.id}">Archive</button></td></tr>`).join('')}</tbody></table>${filtered.length?'':'<p class="sub">No products match your search.</p>'}`}
function renderCheckout(){const q=$('checkoutSearch').value.toLowerCase();const matching=products.filter(p=>[p.name,p.barcode].join(' ').toLowerCase().includes(q)).slice(0,35);$('checkoutProducts').innerHTML=matching.map(p=>`<div class="cart-item"><span><b>${escapeHTML(p.name)}</b><br><small>${escapeHTML(p.barcode||'No barcode')} · ${p.stock} available · ${money(p.priceUsd)}</small></span><button class="btn secondary" data-add="${p.id}" ${p.stock<= (cart[p.id]||0)?'disabled':''}>+ Add</button></div>`).join('');let entries=products.filter(p=>cart[p.id]);$('cart').innerHTML=entries.length?entries.map(p=>`<div class="cart-item"><span><b>${escapeHTML(p.name)}</b><br><small>${money(p.priceUsd)} each</small></span><div class="actions"><button class="btn secondary" data-sub="${p.id}">−</button><b>${cart[p.id]}</b><button class="btn secondary" data-add="${p.id}" ${cart[p.id]>=p.stock?'disabled':''}>+</button></div></div>`).join(''):'<p class="sub">Scan or add products to begin.</p>';const total=entries.reduce((n,p)=>n+cart[p.id]*Number(p.priceUsd),0);$('total').textContent=money(total);$('totalKhr').textContent='៛'+Math.round(total*rate).toLocaleString();$('cartUnits').textContent='('+entries.reduce((n,p)=>n+cart[p.id],0)+' items)';$('pay').disabled=!entries.length}
function add(id){const p=products.find(p=>p.id===id);if(!p)return;if((cart[id]||0)>=p.stock){toast('No more stock available',true);return}cart[id]=(cart[id]||0)+1;renderCheckout()}
function scanValue(code){code=code.trim();if(!code)return;const now=Date.now();if(code===lastBarcode&&now-lastBarcodeTime<650)return;lastBarcode=code;lastBarcodeTime=now;const p=products.find(p=>p.barcode===code);if(scanMode==='inventory'){if(p)openEditor(p);else{openEditor();$('productForm').elements.barcode.value=code}closeScanner();return}if(!p){toast('Barcode not found: '+code,true);return}add(p.id);toast('Added '+p.name)}
function openEditor(p){editing=p||null;$('editorTitle').textContent=p?'Edit product':'Add product';const f=$('productForm');for(const key of ['name','barcode','category','stock','lowStockThreshold'])f.elements[key].value=p?.[key]??(key==='category'?'General':key==='lowStockThreshold'?5:'');f.elements.price.value=p?.priceUsd??0;f.elements.barcode.readOnly=!!p?.barcode;$('editor').showModal()}
async function saveProduct(e){e.preventDefault();const f=e.target,data={name:f.elements.name.value.trim(),barcode:f.elements.barcode.value.trim()||null,category:f.elements.category.value.trim(),price:Number(f.elements.price.value),currency:'USD',stock:Number(f.elements.stock.value),lowStockThreshold:Number(f.elements.lowStockThreshold.value)};if(!data.name||!data.category||data.stock<0){toast('Please enter valid product details',true);return}const btn=f.querySelector('[type=submit]');btn.disabled=true;try{await req(editing?'/products/'+editing.id:'/products',{method:editing?'PUT':'POST',body:JSON.stringify(data)});$('editor').close();toast('Product saved');await refresh()}catch(e){toast(e.message,true)}finally{btn.disabled=false}}
async function checkout(){const items=Object.entries(cart).filter(([,n])=>n>0).map(([productId,quantity])=>({productId,quantity}));if(!items.length)return;const btn=$('pay');btn.disabled=true;try{const sale=await req('/sales/checkout',{method:'POST',body:JSON.stringify({idempotencyKey:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),paidCurrency:$('currency').value,items})});cart={};toast('Sale completed · '+sale.id.slice(0,8));await refresh()}catch(e){toast(e.message,true)}finally{btn.disabled=false}}
async function openScanner(mode){scanMode=mode;lastBarcode='';$('manualCode').value='';$('scanner').showModal();$('scanStatus').textContent='Starting camera…';if(!navigator.mediaDevices?.getUserMedia){$('scanStatus').textContent='Camera unavailable. Use manual entry or a USB barcode reader.';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});$('camera').srcObject=stream;await $('camera').play();if(!('BarcodeDetector'in window)){$('scanStatus').textContent='Camera barcode detection is not supported by this browser. Try Chrome on Android, or use a USB scanner / manual input.';return}let formats=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code'];const supported=await BarcodeDetector.getSupportedFormats();const detector=new BarcodeDetector({formats:formats.filter(f=>supported.includes(f))});scanRunning=true;$('scanStatus').textContent='Point camera at a barcode';async function loop(){if(!scanRunning)return;try{const codes=await detector.detect($('camera'));if(codes.length)scanValue(codes[0].rawValue)}catch{}if(scanRunning)setTimeout(loop,120)}requestAnimationFrame(loop)}catch(e){$('scanStatus').textContent='Camera permission error: '+e.message+' · Use manual entry.'}}
function closeScanner(){scanRunning=false;stream?.getTracks().forEach(t=>t.stop());stream=null;$('camera').srcObject=null;if($('scanner').open)$('scanner').close()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));$('reload').onclick=refresh;$('filter').oninput=renderInventory;$('checkoutSearch').oninput=()=>{const input=$('checkoutSearch');const p=products.find(p=>p.barcode&&p.barcode===input.value.trim());if(p){add(p.id);input.value=''}renderCheckout()};$('newProduct').onclick=()=>openEditor();$('cancelEditor').onclick=()=>$('editor').close();$('productForm').onsubmit=saveProduct;$('clearCart').onclick=()=>{cart={};renderCheckout()};$('pay').onclick=checkout;$('inventoryScan').onclick=()=>openScanner('inventory');$('checkoutScan').onclick=()=>openScanner('checkout');$('closeScanner').onclick=closeScanner;$('scanner').addEventListener('close',closeScanner);$('submitCode').onclick=()=>{scanValue($('manualCode').value);$('manualCode').value=''};$('manualCode').onkeydown=e=>{if(e.key==='Enter'){$('submitCode').click()}};document.addEventListener('click',async e=>{const b=e.target.closest('[data-edit],[data-delete],[data-add],[data-sub]');if(!b)return;const id=b.dataset.edit||b.dataset.delete||b.dataset.add||b.dataset.sub,p=products.find(p=>p.id===id);if(b.dataset.edit)openEditor(p);else if(b.dataset.add)add(id);else if(b.dataset.sub){cart[id]--;if(cart[id]<=0)delete cart[id];renderCheckout()}else if(b.dataset.delete&&confirm('Archive '+p.name+'?')){try{await req('/products/'+id,{method:'DELETE'});toast('Product archived');await refresh()}catch(e){toast(e.message,true)}}});
document.body.insertAdjacentHTML('beforeend',`<div id="portalLogin" style="position:fixed;inset:0;background:#291d48;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px"><form id="portalAuthForm" style="background:white;border-radius:18px;padding:30px;max-width:370px;width:100%;display:grid;gap:14px"><h2>RetailFlow sign in</h2><input id="portalUser" placeholder="Username" autocomplete="username" required><input id="portalPass" placeholder="Password" type="password" autocomplete="current-password" required><div id="portalAuthError" style="color:#b52549"></div><button class="btn" type="submit">Sign in</button></form></div>`);document.getElementById('portalAuthForm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(base+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('portalUser').value,password:document.getElementById('portalPass').value})});if(!r.ok)throw Error('Invalid username or password');portalAuth=await r.json();document.getElementById('portalPass').value='';document.getElementById('portalLogin').style.display='none';refresh()}catch(err){document.getElementById('portalAuthError').textContent=err.message}};
</script></body></html>
