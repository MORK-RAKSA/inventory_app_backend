
server:
  port: ${PORT:8080}

spring:
  application:
    name: retailflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://pooled.db.prisma.io:5432/postgres?sslmode=require}
    username: ${DB_USER:d8b178a67e25e3d14262647b025cd009f84073e4a26510594351f6d689fba592}
    password: ${DB_PASSWORD:sk_J4whUrh4wYStQfyAPgDXg}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        default_schema: ${DB_SCHEMA:public}

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:public}
    schemas: ${DB_SCHEMA:public}
    create-schemas: true
    baseline-on-migrate: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

retail-flow:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:8081}

