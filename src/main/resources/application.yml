server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: retailflow-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://pooled.db.prisma.io:5432/postgres?sslmode=require}
    username: ${DB_USER:d8b178a67e25e3d14262647b025cd009f84073e4a26510594351f6d689fba592}
    password: ${DB_PASSWORD:sk_J4whUrh4wYStQfyAPgDXg}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only verifies it.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
        default_schema: ${DB_SCHEMA:public}

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:public}
    schemas: ${DB_SCHEMA:public}
    create-schemas: true
    baseline-on-migrate: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

retail-flow:
  cors:
    origins: ${CORS_ALLOWED_ORIGINS:*}
  auth:
    # Password-reset recovery key. Empty = the reset endpoint is disabled.
    recovery-key: ${RECOVERY_KEY:}

retailflow:
  storage:
    r2:
      # Optional Cloudflare R2 image storage. Image upload returns 501 when unset.
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      public-url: ${R2_PUBLIC_URL:}
